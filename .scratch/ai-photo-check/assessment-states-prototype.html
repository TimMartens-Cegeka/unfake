<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PROTOTYPE — Assessment result states</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17232d;
      background: #f4f6f3;
      --ink: #17232d;
      --muted: #59666e;
      --line: #d8dfdc;
      --green: #145e4b;
      --green-bg: #e4f3ed;
      --amber: #80531b;
      --amber-bg: #fff2dc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    .banner { background: var(--ink); color: #fff; font-size: .78rem; padding: 10px 16px; text-align: center; }
    main { margin: 0 auto; max-width: 800px; padding: 44px 22px 64px; }
    .eyebrow { color: var(--muted); font-size: .75rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.05em; line-height: 1.08; margin: 10px 0 12px; }
    h2 { font-size: 1rem; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.6; margin: 0; }
    .lead { font-size: 1.05rem; max-width: 680px; }
    .state-picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 30px 0 16px; }
    button { background: white; border: 1px solid #b8c4be; border-radius: 999px; color: var(--ink); cursor: pointer; font: inherit; font-size: .83rem; padding: 9px 13px; }
    button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: white; }
    button:focus-visible { outline: 3px solid #3f94ac; outline-offset: 3px; }
    .state-card, .limits { background: #fff; border: 1px solid var(--line); border-radius: 16px; }
    .state-card { padding: clamp(22px, 5vw, 34px); }
    .status { background: var(--green-bg); border-radius: 999px; color: var(--green); display: inline-block; font-size: .78rem; font-weight: 800; padding: 7px 11px; }
    .status.inconclusive { background: var(--amber-bg); color: var(--amber); }
    .result-title { font-size: clamp(1.55rem, 4vw, 2.15rem); letter-spacing: -.04em; line-height: 1.15; margin: 16px 0 10px; }
    .state-detail { border-top: 1px solid var(--line); display: grid; gap: 6px 22px; grid-template-columns: 155px 1fr; margin-top: 24px; padding-top: 18px; }
    .state-detail strong { font-size: .87rem; }
    .state-detail p { font-size: .9rem; }
    .limits { background: #17232d; color: #fff; margin-top: 14px; padding: 18px 22px; }
    .limits h2 { margin-bottom: 7px; }
    .limits p { color: #d3dedb; font-size: .88rem; }
    .limits p + p { margin-top: 7px; }
    .meaning { border-left: 3px solid #83b5a4; margin-top: 22px; padding-left: 14px; }
    .meaning strong { display: block; font-size: .82rem; margin-bottom: 4px; }
    @media (max-width: 600px) {
      main { padding: 30px 16px 44px; }
      .state-detail { grid-template-columns: 1fr; gap: 5px; }
      .state-detail + .state-detail { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <div class="banner">PROTOTYPE — Draft wording and sample states only; no photo is analyzed.</div>
  <main>
    <span class="eyebrow">AI photo assessment</span>
    <h1>What this assessment can tell you</h1>
    <p class="lead">This prototype focuses on the distinction between evidence found, no reliable signals found, and not enough evidence to assess.</p>

    <div class="state-picker" role="group" aria-label="Preview an assessment outcome">
      <button type="button" data-state="signals">Signals found</button>
      <button type="button" data-state="none">No reliable signals</button>
      <button type="button" data-state="inconclusive">Insufficient evidence</button>
    </div>

    <section id="result" aria-live="polite"></section>
  </main>
  <script>
    const states = {
      signals: {
        label: "AI-generation signals found",
        title: "Some signals suggest AI generation",
        summary: "We found one or more indicators associated with fully AI-generated imagery. These are probabilistic signals, not proof of how this image was made.",
        evidence: "Name the specific signal(s) found and explain, in plain language, what each can and cannot indicate. Mention provenance only when a positive signal is present.",
        interpretation: "The evidence may support an assessment of AI generation, but it cannot certify the image or the event it depicts."
      },
      none: {
        label: "No reliable signals found",
        title: "No reliable AI-generation signals found",
        summary: "This check did not find reliable signals associated with fully AI-generated imagery.",
        evidence: "Say that no reliable signal was found. Do not turn missing provenance into a negative signal or imply that a photo is camera-original.",
        interpretation: "Detection can miss generated images. No reliable signals is not proof that the image is authentic or unedited."
      },
      inconclusive: {
        label: "Insufficient evidence",
        title: "There isn't enough evidence to assess",
        summary: "The available information does not support a reliable assessment of AI generation.",
        evidence: "Keep this distinct from a completed check that found no reliable signals. Give a specific reason only when the system can support it.",
        interpretation: "Insufficient evidence is neither a positive nor a negative signal."
      }
    };

    const params = new URLSearchParams(window.location.search);
    let selected = states[params.get("state")] ? params.get("state") : "signals";

    function render() {
      const item = states[selected];
      const badgeClass = selected === "inconclusive" ? "status inconclusive" : "status";
      document.querySelector("#result").innerHTML = `
        <article class="state-card">
          <span class="${badgeClass}">${item.label}</span>
          <h2 class="result-title">${item.title}</h2>
          <p>${item.summary}</p>
          <div class="state-detail">
            <strong>Evidence to show</strong>
            <p>${item.evidence}</p>
          </div>
          <div class="state-detail">
            <strong>How to interpret it</strong>
            <p>${item.interpretation}</p>
          </div>
          <div class="meaning"><strong>Scope boundary, in every state</strong><p>Post-capture AI editing, enhancement, and retouching cannot be reliably assessed.</p></div>
        </article>
        <aside class="limits">
          <h2>Not an authenticity verdict</h2>
          <p>A positive provenance signal may add evidence when present. Its absence says nothing about how the image was made.</p>
        </aside>
      `;
      document.querySelectorAll("[data-state]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.state === selected));
      });
    }

    document.querySelectorAll("[data-state]").forEach(button => {
      button.addEventListener("click", () => {
        selected = button.dataset.state;
        const next = new URLSearchParams(window.location.search);
        next.set("state", selected);
        window.location.search = next.toString();
      });
    });

    render();
  </script>
</body>
</html>
